name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare static files
        shell: bash
        run: |
          mkdir -p dist/guides
          cp index.html README.md original.md 原文.md logo.png og-banner.jpg robots.txt sitemap.xml dist/
          cp -R original-assets videos dist/
          if test -f testimonials.jpg; then cp testimonials.jpg dist/; fi
          touch dist/.nojekyll
          for guide in compare-plans payment-and-renewal prodclub-referral; do
            printf '%s\n' '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../#steps"><link rel="canonical" href="../"><title>ProdClub</title><a href="../#steps">ProdClub 开通教程</a></html>' > "dist/guides/$guide.html"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
